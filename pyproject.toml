    "torchmetrics>=1.6.1",
    "tqdm>=4.67.1",
    "transformers>=4.47.1",
    "xgboost>=2.1.3",
    "pydub>=0.25.1",
    "mlflow>=3.3.2",
    "psmpy>=0.3.14",
    "spafe>=0.3.3",
    "marimo>=0.19.6",
    "altair>=5.5.0",
    "pyzmq>=27.0.1",
    "soundfile>=0.13.1",
