[dependency-groups]
dev = [
    "hypothesis>=6.135.10",
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "pytest-mock>=3.6.0",
    "pytest-xdist>=3.0.0",
]

[tool.ruff]
fix = true

[tool.ruff.lint]
