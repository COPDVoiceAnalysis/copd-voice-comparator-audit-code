    "matplotlib>=3.10.0",
    "nbformat>=5.10.4",
    "noisereduce>=3.0.3",
    "opensmile>=2.5.0",
    "openpyxl>=3.1.5",
    "pandas>=2.2.3",
    "plotly>=5.24.1",
    "praat-parselmouth>=0.4.5",
    "pydantic>=2.0.0",
    "pywavelet>=0.2.8",
    "pywavelets>=1.8.0",
    "ray[default,train,tune]>=2.40.0",
    "scikit-learn<1.6",
