# ============================================================================
# PIPELINE CONSTANTS - Infrastructure & Hyperparameter Search Spaces
# ============================================================================

# Optional: PS/overlap weighting covariates (age, sex + comorbidity_count_bin). Path may use {date} (filled from snakemake_matrix).
# Stored in Stimmaufnahmen (RAW_DIR); built from Excel by rule build_comorbidities.
ps_covariates_file: "/data/cephfs-1/work/groups/mittermaier/stimmaufnahmen/{date}/comorbidities.csv"

# Basenames for comorbidities build (files must exist in RAW_DIR after sync).
# Override comorbidities_xlsx_basename if your file has a different name (e.g. comorbidities_2026_01_28.xlsx).
comorbidities_xlsx_basename: "comorbidities_2026_01_28.xlsx"
voice_audio_id_xlsx_basename: "voice_audio_id.xlsx"

# Feature variant configurations
# Feature groups explained:
# - include_egemaps_features: 88 standardized eGeMAPS v02 features (prefixed "egemaps_")
#   Includes MFCCs, F0, HNR, jitter, shimmer, formants, spectral descriptors
# - include_basic_acoustics: Custom Parselmouth F0, HNR, jitter, shimmer, intensity, semitone stats
#   Note: Overlaps conceptually with eGeMAPS but uses different names (both included when both enabled)
# - include_spectral_analysis + include_mfcc_derivatives: Spectral group = base MFCCs, formants, spectral measures
#   (alpha_ratio, hammarberg_index, spectral_flux, slopes) plus delta/delta-delta MFCCs. Used together for parsel_X_spectral.
# - include_advanced_voice_quality: CPP (cepstral peak prominence) and DSI (dysphonia severity index)
# - include_temporal_features: Voiced/unvoiced durations, pseudo-syllable rate
#
# Mapping to results table columns:
# - parsel_X_spectral → "Spectral features" column (includes spectral_analysis + mfcc_derivatives)
# - parsel_X_basic_acoustics → "Basic acoustics" column
# - parsel_X_egemaps → "eGeMAPS" column
# - parsel_X_temporal → "Temporal features" column
# - parsel_X_all_features → "All acoustic features" column
# - wav2vec_X → "wav2vec2" column
#
feature_variant_configs:
  __egemaps: &egemaps
    include_basic_acoustics: false
    include_egemaps_features: true
    include_advanced_voice_quality: false
    include_spectral_analysis: false
    include_mfcc_derivatives: false
    include_temporal_features: false

  __spectral: &spectral
    include_basic_acoustics: false
    include_egemaps_features: false
    include_advanced_voice_quality: false
    include_spectral_analysis: true
    include_mfcc_derivatives: true
    include_temporal_features: false

  __basic_acoustics: &basic_acoustics
    include_basic_acoustics: true
    include_egemaps_features: false
    include_advanced_voice_quality: false
    include_spectral_analysis: false
    include_mfcc_derivatives: false
    include_temporal_features: false

  __temporal: &temporal
    include_basic_acoustics: false
    include_egemaps_features: false
    include_advanced_voice_quality: false
    include_spectral_analysis: false
    include_mfcc_derivatives: false
    include_temporal_features: true

  __all_but_mfcc: &all_but_mfcc
    include_basic_acoustics: true
    include_egemaps_features: true
    include_advanced_voice_quality: true
    include_spectral_analysis: true
    include_mfcc_derivatives: false
    include_temporal_features: true

  __all_features: &all_features
    include_basic_acoustics: true
    include_egemaps_features: true
    include_advanced_voice_quality: true
    include_spectral_analysis: true
    include_mfcc_derivatives: true
    include_temporal_features: true

  # Vowel "a" variations
  parsel_a_egemaps:
    recordings_parsel: [ "a" ]
    recordings_wav2vec2: []
    parselmouth_config: *egemaps

  # Spectral: spectral analysis + MFCC derivatives (single group)
  parsel_a_spectral:
    recordings_parsel: [ "a" ]
    recordings_wav2vec2: []
    parselmouth_config: *spectral

  parsel_a_basic_acoustics:
    recordings_parsel: [ "a" ]
    recordings_wav2vec2: []
    parselmouth_config: *basic_acoustics

  # Temporal only
  parsel_a_temporal:
    recordings_parsel: [ "a" ]
    recordings_wav2vec2: []
    parselmouth_config: *temporal

  # All but MFCC derivatives
  parsel_a_all_but_mfcc:
    recordings_parsel: [ "a" ]
    recordings_wav2vec2: []
    parselmouth_config: *all_but_mfcc

  # All feature groups
  parsel_a_all_features:
    recordings_parsel: [ "a" ]
    recordings_wav2vec2: []
    parselmouth_config: *all_features

  wav2vec_a:
    recordings_parsel: []
    recordings_wav2vec2: [ "a" ]
    wav2vec2_layer: 4
    wav2vec2_embedding_statistics: "mean"
    parselmouth_config: *egemaps

  # Vowel "i" variations
  parsel_i_egemaps:
    recordings_parsel: [ "i" ]
    recordings_wav2vec2: []
    parselmouth_config: *egemaps

  # Spectral: spectral analysis + MFCC derivatives (single group)
  parsel_i_spectral:
    recordings_parsel: [ "i" ]
    recordings_wav2vec2: []
    parselmouth_config: *spectral

  parsel_i_basic_acoustics:
    recordings_parsel: [ "i" ]
    recordings_wav2vec2: []
    parselmouth_config: *basic_acoustics

  # Temporal only
  parsel_i_temporal:
    recordings_parsel: [ "i" ]
    recordings_wav2vec2: []
    parselmouth_config: *temporal

  # All but MFCC derivatives
  parsel_i_all_but_mfcc:
    recordings_parsel: [ "i" ]
    recordings_wav2vec2: []
    parselmouth_config: *all_but_mfcc

  # All feature groups
  parsel_i_all_features:
    recordings_parsel: [ "i" ]
    recordings_wav2vec2: []
    parselmouth_config: *all_features
    
  wav2vec_i:
    recordings_parsel: []
    recordings_wav2vec2: [ "i" ]
    wav2vec2_layer: 4
    wav2vec2_embedding_statistics: "mean"
    parselmouth_config: *egemaps

  # Vowel "o" variations
  parsel_o_egemaps:
    recordings_parsel: [ "o" ]
    recordings_wav2vec2: []
    parselmouth_config: *egemaps

  # Spectral: spectral analysis + MFCC derivatives (single group)
  parsel_o_spectral:
    recordings_parsel: [ "o" ]
    recordings_wav2vec2: []
    parselmouth_config: *spectral

  parsel_o_basic_acoustics:
    recordings_parsel: [ "o" ]
    recordings_wav2vec2: []
    parselmouth_config: *basic_acoustics

  # Temporal only
  parsel_o_temporal:
    recordings_parsel: [ "o" ]
    recordings_wav2vec2: []
    parselmouth_config: *temporal

  # All but MFCC derivatives
  parsel_o_all_but_mfcc:
    recordings_parsel: [ "o" ]
